aid: asylon
name: Asylon
description: >-
  Asylon Robotics is an American-made robotic security company founded in 2015
  and headquartered in Norristown, Pennsylvania, that automates physical
  perimeter security with autonomous drones, ground robots, software, and AI.
  Its flagship products include the Guardian automated security drone (the most
  widely used automated security drone system, with tens of thousands of patrol
  and alarm-response missions completed), the DroneDog quadruped ground robot
  built on Boston Dynamics Spot with the Asylon DogHouse charging enclosure and
  PupPack cellular PTZ payload, and DroneIQ, the Robotic Security Operations
  Center (RSOC) and software platform that coordinates robotic assets, fixed
  surveillance, and human operators. DroneIQ exposes an open-architecture
  integration layer for third-party alarms and sensors (radar, smart fences,
  Bosch alarm panels, gun-detection computer vision, Genetec), but the company
  publishes no public developer portal, OpenAPI specification, or SDKs; API and
  integration access is arranged directly with Asylon. Asylon raised a $26M
  Series B in July 2025 led by Insight Partners.
